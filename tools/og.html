<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Ảnh xem trước 1200 x 630</title>
<!--
  Trang này chỉ dùng để chụp ảnh xem trước (assets/og-image.png),
  là tấm ảnh hiện ra khi bạn gửi link qua Zalo hoặc Messenger.
  Muốn đổi chữ trên ảnh: sửa chữ bên dưới, mở trang này bằng Chrome,
  chụp đúng khung 1200 x 630 rồi lưu đè lên assets/og-image.png.
-->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    padding: 0 70px 0 110px;
    color: #5B2A3C;
    background:
      radial-gradient(circle at 20px 20px, rgba(255, 255, 255, .42) 4px, transparent 5px) 0 0 / 40px 40px,
      linear-gradient(165deg, #FFB6C8 0%, #FF8FAB 62%, #F9809F 100%);
  }

  /* Gáy sách và đường chỉ khâu */
  .card::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 46px;
    background: linear-gradient(90deg, #D9537E, #F58AA8);
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 26px 26px 26px 72px;
    border: 4px dashed rgba(255, 255, 255, .85);
    border-radius: 18px 34px 34px 18px;
  }

  .left { position: relative; z-index: 1; flex: 1; }

  .plate {
    display: inline-block;
    padding: 18px 56px 30px;
    background: #FFFDF9;
    border-radius: 48px;
    box-shadow: 0 12px 0 rgba(184, 67, 106, .45);
  }
  .kicker {
    display: block;
    font-family: "Pacifico", cursive;
    font-size: 124px;
    line-height: 1.3;
    color: #E8638C;
  }
  .title {
    display: block;
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 54px;
    line-height: 1.1;
    color: #5B4A4A;
  }
  .tag {
    display: inline-block;
    margin: 44px 0 0 18px;
    padding: 12px 40px 8px;
    border-radius: 999px;
    background: #FFE9A8;
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 40px;
    transform: rotate(-3deg);
    box-shadow: 0 8px 0 rgba(91, 42, 60, .2);
  }

  .bear { position: relative; z-index: 1; width: 470px; flex: none; margin-right: -20px; }
  .bear img { display: block; width: 100%; }

  .deco { position: absolute; z-index: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="plate">
        <span class="kicker">Thư mời</span>
        <span class="title">dự Lễ tốt nghiệp</span>
      </div>
      <br>
      <span class="tag">Chạm để mở thư nhé</span>
    </div>
    <div class="bear"><img src="../assets/mascot.svg" alt=""></div>

    <svg class="deco" style="top:70px; right:455px; width:60px" viewBox="0 0 24 24"><path fill="#F6C453" d="M12 3.5c.7 5.2 3.3 7.8 8.5 8.5-5.2.7-7.8 3.3-8.5 8.5-.7-5.2-3.3-7.8-8.5-8.5 5.2-.7 7.8-3.3 8.5-8.5z"/></svg>
    <svg class="deco" style="bottom:66px; right:70px; width:54px" viewBox="0 0 24 24"><path fill="#fff" d="M12 21.2c-.4 0-.8-.1-1.1-.4C6.1 17 2 13.4 2 8.9 2 6 4.2 3.8 7 3.8c1.9 0 3.6 1 5 2.9 1.4-1.9 3.1-2.9 5-2.9 2.8 0 5 2.2 5 5.1 0 4.5-4.1 8.1-8.9 11.9-.3.3-.7.4-1.1.4z"/></svg>
    <svg class="deco" style="top:64px; right:74px; width:44px" viewBox="0 0 24 24"><path fill="#FFE9A8" d="M12 3.5c.7 5.2 3.3 7.8 8.5 8.5-5.2.7-7.8 3.3-8.5 8.5-.7-5.2-3.3-7.8-8.5-8.5 5.2-.7 7.8-3.3 8.5-8.5z"/></svg>
  </div>
</body>
</html>
